# ─────────────────────────────────────────────────────────────────────────────
# Publications
#
#  • 게재 확정(Accepted) 논문: 지금처럼 title / authors / url / journal / image / summary 를 적으면 됩니다.
#    status 를 안 적으면 Accepted 로 취급합니다.
#
#  • 아직 게재 전인 논문 → 홈페이지의 "In Preparation" 탭에 잠긴 카드로 나옵니다.
#    status 는 셋 중 하나:  in_preparation | submitted | under_review   (카드에 이 글자만 보임)
#    progress 는 둘 중 하나: completed (작성 완료) | in_progress (실험·작성 진행 중)
#      안 적으면 in_preparation 은 in_progress, submitted·under_review 는 completed 로 표시
#
#    이 파일에는 학회 이름·제목·저자·TLDR·이미지를 평문으로 적지 마세요.
#    이 저장소는 공개라서, 여기에 쓰는 순간 GitHub 검색·구글에 노출됩니다.
#    (CVPR 등은 심사 중인 논문을 공개 웹사이트에 "CVPR 제출작"으로 올리는 것 자체를 금지합니다.)
#    대신 https://v2llain.github.io/seal/ 에서 내용을 적고 암호를 정하면
#      ① sealed/<id>.json (암호화된 파일)  ② 아래에 붙여 넣을 2~3줄
#    이 나옵니다. ①을 sealed/ 폴더에 올리고 ②를 이 파일에 붙여 넣으면 끝입니다.
#    peek 은 암호화가 아니라 base64 라서 GitHub 검색·구글엔 안 걸리지만, 소스를 뜯어보면 읽힙니다.
#
#      - status: submitted
#        sealed: 3f9c2a7be1d4         # sealed/3f9c2a7be1d4.json (없으면 빈 잠금 카드)
#        progress: completed
#        peek: "QW4gRXhhbXBsZSBUaXRsZQ==" # 덮개 접힌 모서리로 살짝 보일 제목 (base64 — /seal/ 이 만들어 줌)
#        blur: "/9j/4AAQ..."            # 그림을 32px로 줄인 흐린 미리보기 (/seal/ 이 만들어 줌)
#
#    예외: arXiv 등에 이미 공개한 논문처럼 제목을 일부러 보여주고 싶을 때만
#    title: / authors: / url: 을 여기에 적으면 그 부분만 공개됩니다 (TLDR·이미지는 계속 잠김).
#    학회 이름(journal)은 적어도 홈페이지에 표시하지 않습니다.
#
#  • 게재가 확정되면: /seal/ 에서 그 파일을 열어 내용을 확인한 뒤, 일반 항목으로 옮기고
#    sealed/<id>.json 은 지우면 됩니다.
# ─────────────────────────────────────────────────────────────────────────────
