# Albums for the sidebar player, in the order the ◀ ▶ buttons go through them.
# folder: the folder inside /music/ that holds the album's songs
# look:   which artwork/animation to use (replica = Vaundy LP, rejoice = Official髭男dism CDs, iris = 米津玄師 LP, march = なとり LP)
- folder: vaundy
  artist: Vaundy
  album: replica
  look: replica
- folder: official-hige-dandism
  artist: Official髭男dism
  album: Rejoice
  look: rejoice
- folder: yonezu-kenshi
  artist: 米津玄師
  album: IRIS OUT / JANE DOE
  look: iris
- folder: natori
  artist: なとり
  album: 行進
  look: march
